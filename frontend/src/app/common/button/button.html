@switch (variant()) {
  @case ('outlined') {
    <button
      mat-stroked-button
      [matTooltip]="tooltipTitle() || ''"
      [matTooltipDisabled]="!tooltipTitle()"
      class="tt-button"
      [disabled]="disabled()"
      [ngClass]="buttonClass()"
      [ngStyle]="buttonStyle()"
    >
      <ng-content></ng-content>
    </button>
  }
  @case ('tonal') {
    <button
      mat-stroked-button
      [matTooltip]="tooltipTitle() || ''"
      [matTooltipDisabled]="!tooltipTitle()"
      class="tt-button"
      [disabled]="disabled()"
      [ngClass]="buttonClass()"
      [ngStyle]="buttonStyle()"
    >
      <ng-content></ng-content>
    </button>
  }
  @case ('text') {
    <button
      mat-button
      [matTooltip]="tooltipTitle() || ''"
      [matTooltipDisabled]="!tooltipTitle()"
      class="tt-button"
      [disabled]="disabled()"
      [ngClass]="buttonClass()"
      [ngStyle]="buttonStyle()"
    >
      <ng-content></ng-content>
    </button>
  }
  @default {
    <button
      mat-flat-button
      [matTooltip]="tooltipTitle() || ''"
      [matTooltipDisabled]="!tooltipTitle()"
      class="tt-button"
      [disabled]="disabled()"
      [ngClass]="buttonClass()"
      [ngStyle]="buttonStyle()"
    >
      <ng-content></ng-content>
    </button>
  }
}
