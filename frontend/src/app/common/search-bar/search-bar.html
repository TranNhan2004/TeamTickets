<div
  class="tt-search-bar"
  [style.width]="width()"
  [style.max-width]="maxWidth()"
>
  <mat-icon class="tt-search-bar__icon" aria-hidden="true">search</mat-icon>
  <input
    matInput
    class="tt-search-bar__input"
    type="search"
    [formControl]="searchControl"
    placeholder="Search"
    aria-label="Search"
  />
</div>
