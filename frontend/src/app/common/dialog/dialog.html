@if (isOpen()) {
  <div class="tt-dialog-backdrop" (click)="handleBackdropClick($event)">
    <section
      class="tt-dialog"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="ariaLabel() || title()"
      [ngStyle]="dialogStyle()"
    >
      <header class="tt-dialog__header">
        <h2 mat-dialog-title class="tt-dialog__title">{{ title() }}</h2>
        <button
          mat-icon-button
          type="button"
          class="tt-dialog__close"
          aria-label="Close dialog"
          (click)="closeDialog()"
        >
          <mat-icon aria-hidden="true">close</mat-icon>
        </button>
      </header>

      <mat-dialog-content class="tt-dialog__content">
        <ng-content></ng-content>
      </mat-dialog-content>

      <mat-dialog-actions class="tt-dialog__actions" align="end">
        <ng-content select="[dialog-actions]"></ng-content>
      </mat-dialog-actions>
    </section>
  </div>
}
