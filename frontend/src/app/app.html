<div>
  <div>
    <img src="/logo.png" alt="Logo" class="logo" width="50" height="50" />
    {{ title() }}
  </div>

  <div>
    <app-button
      style="margin-left: 5px"
      label="Filled"
      variant="filled"
      color="primary"
      size="sm"
      [disabled]="true"
      tooltipTitle="Disabled filled button"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Filled"
      variant="filled"
      color="warning"
      size="md"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Filled"
      variant="filled"
      color="success"
      size="md"
      tooltipTitle="Success action"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Filled"
      variant="filled"
      color="info"
      size="md"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Filled"
      variant="filled"
      color="neutral"
      size="md"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Filled"
      variant="filled"
      color="danger"
      size="md"
    ></app-button>
  </div>

  <div>
    <app-button
      style="margin-left: 5px"
      label="Outlined"
      variant="outlined"
      color="primary"
      [tooltipTitle]="'More details'"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Outlined"
      variant="outlined"
      color="primary"
      size="sm"
      [disabled]="true"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Outlined"
      variant="outlined"
      color="warning"
      size="md"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Outlined"
      variant="outlined"
      color="success"
      size="md"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Outlined"
      variant="outlined"
      color="info"
      size="md"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Outlined"
      variant="outlined"
      color="neutral"
      size="md"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Outlined"
      variant="outlined"
      color="danger"
      size="md"
    ></app-button>
  </div>

  <div>
    <app-button
      style="margin-left: 5px"
      label="Text"
      variant="text"
      color="primary"
      tooltipTitle="Text action"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Text Underline"
      variant="text"
      color="info"
      afterPressEffect="underline"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Text Warning"
      variant="text"
      color="warning"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Text Disabled"
      variant="text"
      color="neutral"
      [disabled]="true"
    ></app-button>
  </div>

  <div>
    <app-button
      style="margin-left: 5px"
      label="Tonal"
      variant="tonal"
      color="primary"
      tooltipTitle="Tonal action"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Tonal"
      variant="tonal"
      color="warning"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Tonal"
      variant="tonal"
      color="success"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Tonal"
      variant="tonal"
      color="info"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Tonal"
      variant="tonal"
      color="neutral"
    ></app-button>
    <app-button
      style="margin-left: 5px"
      label="Tonal"
      variant="tonal"
      color="danger"
      [disabled]="true"
    ></app-button>
  </div>

  <div>
    <app-chip
      style="margin-left: 5px"
      label="Filled Chip"
      variant="filled"
      color="primary"
      tooltipTitle="Display chip"
    ></app-chip>
    <app-chip
      style="margin-left: 5px"
      label="Outlined Chip"
      variant="outlined"
      color="warning"
    ></app-chip>
    <app-chip
      style="margin-left: 5px"
      label="Tonal Chip"
      variant="tonal"
      color="success"
    ></app-chip>
    <app-chip
      style="margin-left: 5px"
      label="Text Chip"
      variant="text"
      color="info"
    ></app-chip>
    <app-chip
      style="margin-left: 5px"
      label="Neutral Chip"
      variant="filled"
      color="neutral"
    ></app-chip>
  </div>
</div>
